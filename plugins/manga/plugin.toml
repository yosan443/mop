id = "mop.manga"
name = "Manga Conversion"
version = "0.1.0"
api_version = "1"
description = "Archive to WebP CBZ converter and directory watcher"

[ui]
entry = "ui/index.js"
element = "mop-plugin-manga"

[backend]
exec = "mop-plugin-manga"

[capabilities]
jobs = ["manga.convert", "manga.batch", "manga.inspect"]
