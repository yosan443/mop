name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-checks:
    name: Rust Checks & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Node & pnpm for web build
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: 'web/pnpm-lock.yaml'

      - name: Build Web Frontend (required for rust-embed)
        run: |
          cd web
          pnpm install --frozen-lockfile || pnpm install
          pnpm build

      - name: Check Formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Run Workspace Tests
        run: cargo test --workspace

  web-checks:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Web Dependencies
        run: |
          cd web
          pnpm approve-builds --all || true
          pnpm install

      - name: Run Typecheck
        run: |
          cd web
          pnpm typecheck

      - name: Run Build
        run: |
          cd web
          pnpm build

  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Web Frontend
        run: |
          cd web
          pnpm approve-builds --all || true
          pnpm install
          pnpm build

      - name: Build mop-cli Binary
        run: cargo build -p mop-cli

      - name: Install E2E Dependencies & Playwright Browsers
        run: |
          cd e2e
          pnpm approve-builds --all || true
          pnpm install
          npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        run: |
          cd e2e
          pnpm test
