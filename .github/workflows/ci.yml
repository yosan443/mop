name: CI

on:
  push:
    branches: [ main, feat/* ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-checks:
    name: Rust Checks & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsystemd-dev libarchive-dev libvips-dev ffmpeg

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Build Web Frontend (required for rust-embed)
        run: |
          cd web
          pnpm approve-builds --all || true
          pnpm install
          pnpm build

      - name: Check Formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Run Workspace Tests
        run: cargo test --workspace

  web-checks:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install Web Dependencies
        run: |
          cd web
          pnpm approve-builds --all || true
          pnpm install

      - name: Run Typecheck
        run: |
          cd web
          pnpm typecheck

      - name: Run Build
        run: |
          cd web
          pnpm build

  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsystemd-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Build Web Frontend
        run: |
          cd web
          pnpm approve-builds --all || true
          pnpm install
          pnpm build

      - name: Build mop-cli Binary
        run: cargo build -p mop-cli

      - name: Build mop-plugin-hello Binary
        run: cargo build -p mop-plugin-hello

      - name: Install E2E Dependencies & Playwright Browsers
        run: |
          cd e2e
          pnpm approve-builds --all || true
          pnpm install
          npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        run: |
          cd e2e
          pnpm test
