[workspace]
resolver = "2"
members = [
    "crates/mop-core",
    "crates/mop-db",
    "crates/mop-auth",
    "crates/mop-watch",
    "crates/mop-jobs",
    "crates/mop-plugin",
    "crates/mop-plugin-sdk",
    "crates/mop-http",
    "crates/mop-cli",
    "plugins/hello",
    "plugins/common",
    "plugins/manga",
    "plugins/video",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["mop contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/yosan443/mop"

[workspace.dependencies]
# Internal crates
mop-core = { path = "crates/mop-core" }
mop-db = { path = "crates/mop-db" }
mop-auth = { path = "crates/mop-auth" }
mop-watch = { path = "crates/mop-watch" }
mop-jobs = { path = "crates/mop-jobs" }
mop-plugin = { path = "crates/mop-plugin" }
mop-plugin-sdk = { path = "crates/mop-plugin-sdk" }
mop-plugin-common = { path = "plugins/common" }
mop-http = { path = "crates/mop-http" }

# Async & Runtime
tokio = { version = "1.43", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
async-trait = "0.1"
futures = "0.3"
futures-util = "0.3"

# System & Container APIs
zbus = { version = "5.5", default-features = false, features = ["tokio"] }
bollard = "0.18"

# Web & HTTP
axum = { version = "0.8", features = ["macros", "tokio"] }
axum-login = "0.17"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "set-header"] }
tower-sessions = { version = "0.14", features = ["signed"] }
tower-sessions-sqlx-store = { version = "0.15", features = ["sqlite"] }
http = "1.2"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Utilities
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ulid = { version = "1.2", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
argon2 = { version = "0.5", features = ["std"] }
password-hash = { version = "0.5", features = ["rand_core"] }
clap = { version = "4.5", features = ["derive", "env"] }
rust-embed = { version = "8.5", features = ["interpolate-folder-path", "mime-guess"] }
mime_guess = "2.0"
tempfile = "3.17"
regex = "1.11"
tar = "0.4"
zstd = "0.13"
sha2 = "0.10"
